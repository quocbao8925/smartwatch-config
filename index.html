<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POMODORO Setup Pro</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --input-bg: #ffffff;
            --input-border: #e2e8f0;
            --accent: #d9534f;
        }

        .dark-mode {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --input-bg: #0f172a;
            --input-border: #334155;
        }

        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main);
            margin: 0; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.3s;
        }

        /* Nền Gradient tĩnh - Không lag */
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 10% 20%, rgba(217, 83, 79, 0.05) 0%, transparent 40%),
                        radial-gradient(circle at 90% 80%, rgba(0, 123, 255, 0.05) 0%, transparent 40%);
            z-index: -1;
        }

        .card { 
            background: var(--card-bg); 
            padding: 35px; border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
            width: 100%; max-width: 480px; 
            position: relative; border: 1px solid var(--input-border);
        }

        .theme-toggle {
            position: absolute; top: 20px; right: 20px;
            background: var(--input-bg); border: 1px solid var(--input-border);
            padding: 6px 12px; border-radius: 20px; cursor: pointer;
            color: var(--text-main); font-size: 12px; font-weight: bold;
            display: flex; align-items: center; gap: 5px;
        }

        h2 { text-align: center; color: var(--accent); margin-bottom: 25px; }

        .input-group { position: relative; margin: 15px 0; }
        
        input, select { 
            width: 100%; padding: 12px; border-radius: 10px; 
            border: 1px solid var(--input-border); background: var(--input-bg);
            color: var(--text-main); box-sizing: border-box; font-size: 14px;
        }

        .pass-toggle {
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
            cursor: pointer; opacity: 0.6; font-size: 14px;
        }

        .setting-group { 
            background: var(--bg-color); padding: 20px; border-radius: 12px; 
            margin: 20px 0; border: 1px solid var(--input-border); 
        }

        button.main-btn { 
            background: #007bff; color: white; border: none; padding: 14px; 
            border-radius: 10px; width: 100%; font-weight: bold; cursor: pointer;
            margin-top: 10px; transition: 0.2s;
        }

        button.main-btn:disabled { background: #cbd5e0; cursor: not-allowed; }
        
        #btnConnect { background: #28a745; margin-bottom: 15px; }

        .reset-link { 
            display: block; text-align: center; margin-top: 15px; 
            font-size: 12px; color: var(--text-sub); text-decoration: none; cursor: pointer;
        }

        #log { margin-top: 15px; font-size: 13px; min-height: 40px; text-align: center; font-weight: 500; }
    </style>
</head>
<body onload="loadSavedSettings()">

    <div class="card">
        <button id="theme-toggle" class="theme-toggle" onclick="toggleDarkMode()">
            <span id="theme-icon">☀️</span> <span id="theme-text">LIGHT</span>
        </button>
        
        <h2>🍅 POMODORO CONFIG</h2>
        
        <button id="btnConnect" class="main-btn" onclick="connectPort()">1. Connect Device</button>
        
        <div class="input-group">
            <label style="font-size: 13px; font-weight: 600;">WiFi Name (SSID)</label>
            <input type="text" id="ssid" placeholder="Enter WiFi name..." oninput="saveSettings()">
        </div>

        <div class="input-group">
            <label style="font-size: 13px; font-weight: 600;">WiFi Password</label>
            <input type="password" id="pass" placeholder="••••••••" oninput="saveSettings()">
            <span class="pass-toggle" onclick="togglePass()">👁️</span>
        </div>
        
        <div class="setting-group">
            <label style="font-size: 13px; font-weight: 600;">Buzzer Volume: <span id="volVal">50</span>%</label>
            <input type="range" id="vol" min="0" max="100" value="50" oninput="updateVol(this.value); saveSettings()">
            
            <div style="display: flex; align-items: center; margin-top: 15px; justify-content: space-between;">
                <span style="font-size: 13px; font-weight: 600;">24-Hour Format</span>
                <input type="checkbox" id="fmt24" checked style="width: 20px;" onchange="saveSettings()">
            </div>

            <div style="margin-top: 15px;">
                <label style="font-size: 13px; font-weight: 600;">Screen Timeout</label>
                <select id="timeout" onchange="saveSettings()">
                    <option value="10">10 Seconds</option>
                    <option value="15" selected>15 Seconds</option>
                    <option value="30">30 Seconds</option>
                </select>
            </div>
        </div>

        <button id="btnSend" class="main-btn" onclick="sendData()" disabled>2. Sync & Restart</button>
        
        <div id="log">Waiting for connection...</div>
        
        <a class="reset-link" onclick="resetAll()">Clear saved data</a>
    </div>

    <script>
        let port;

        function togglePass() {
            const p = document.getElementById("pass");
            p.type = p.type === "password" ? "text" : "password";
        }

        function updateVol(val) { document.getElementById("volVal").innerText = val; }

        function saveSettings() {
            const settings = {
                ssid: document.getElementById("ssid").value,
                pass: document.getElementById("pass").value,
                vol: document.getElementById("vol").value,
                fmt24: document.getElementById("fmt24").checked,
                timeout: document.getElementById("timeout").value
            };
            localStorage.setItem("pomo_v2", JSON.stringify(settings));
        }

        function loadSavedSettings() {
            const isDark = localStorage.getItem("dark") === "true";
            if (isDark) document.body.classList.add("dark-mode");
            updateThemeUI(isDark);

            const saved = JSON.parse(localStorage.getItem("pomo_v2"));
            if (saved) {
                document.getElementById("ssid").value = saved.ssid || "";
                document.getElementById("pass").value = saved.pass || "";
                document.getElementById("vol").value = saved.vol || 50;
                document.getElementById("volVal").innerText = saved.vol || 50;
                document.getElementById("fmt24").checked = saved.fmt24;
                document.getElementById("timeout").value = saved.timeout || "15";
            }
        }

        function resetAll() {
            if(confirm("Xóa toàn bộ dữ liệu đã lưu?")) {
                localStorage.removeItem("pomo_v2");
                location.reload();
            }
        }

        function toggleDarkMode() {
            const isDark = document.body.classList.toggle("dark-mode");
            localStorage.setItem("dark", isDark);
            updateThemeUI(isDark);
        }

        function updateThemeUI(isDark) {
            document.getElementById("theme-icon").innerText = isDark ? "🌙" : "☀️";
            document.getElementById("theme-text").innerText = isDark ? "DARK" : "LIGHT";
        }

        async function connectPort() {
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });
                document.getElementById("btnConnect").innerText = "Device Connected ✓";
                document.getElementById("btnConnect").style.background = "#218838";
                document.getElementById("btnSend").disabled = false;
                log("Ready to sync!", "#007bff");
            } catch (e) { log("Connection failed: " + e.message, "#d9534f"); }
        }

        async function sendData() {
            const ssid = document.getElementById("ssid").value;
            if (!ssid) { log("Please enter WiFi Name!", "#d9534f"); return; }

            const s = JSON.parse(localStorage.getItem("pomo_v2"));
            const payload = JSON.stringify({
                s: s.ssid, p: s.pass, t: Math.floor(Date.now()/1000), 
                v: parseInt(s.vol), h: s.fmt24?1:0, o: parseInt(s.timeout)
            }) + "\r\n";

            try {
                const writer = port.writable.getWriter();
                await writer.write(new TextEncoder().encode(payload));
                writer.releaseLock();
                log("Successfully Synced! Device restarting...", "#28a745");
            } catch (e) { log("Sync error: " + e.message, "#d9534f"); }
        }

        function log(msg, color) {
            const l = document.getElementById("log");
            l.innerText = msg;
            l.style.color = color;
        }
    </script>
</body>
</html>
