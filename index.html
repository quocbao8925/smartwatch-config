<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POMODORO Setup Pro</title>
    <style>
        /* Hệ thống màu sắc tối ưu */
        :root {
            --bg-color: #f4f7fa;
            --card-bg: #ffffff;
            --text-main: #2d3436;
            --text-sub: #636e72;
            --input-bg: #ffffff;
            --input-border: #dfe6e9;
            --accent: #d9534f;
            --btn-green: #2ecc71;
            --btn-blue: #0984e3;
        }

        .dark-mode {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --input-bg: #0f172a;
            --input-border: #334155;
        }

        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background: var(--bg-color); 
            color: var(--text-main);
            margin: 0; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.3s ease;
        }

        /* Thêm một chút trang trí nền nhẹ nhàng, không lag */
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 0% 0%, rgba(217, 83, 79, 0.03) 0%, transparent 50%),
                        radial-gradient(circle at 100% 100%, rgba(9, 132, 227, 0.03) 0%, transparent 50%);
            z-index: -1;
        }

        .card { 
            background: var(--card-bg); 
            padding: 40px; border-radius: 24px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.05); 
            width: 95%; max-width: 500px; 
            position: relative; border: 1px solid var(--input-border);
            box-sizing: border-box;
        }

        /* Theme Toggle (Nút Light/Dark) */
        .theme-toggle {
            position: absolute; top: 20px; right: 20px;
            background: var(--input-bg); border: 1px solid var(--input-border);
            padding: 8px 16px; border-radius: 30px; cursor: pointer;
            color: var(--text-main); font-size: 11px; font-weight: 800;
            display: flex; align-items: center; gap: 8px;
            transition: 0.3s;
        }

        #theme-icon { transition: transform 0.5s ease; font-size: 14px; }

        h2 { text-align: center; color: var(--accent); letter-spacing: 2px; margin-top: 10px; }

        .input-wrapper { position: relative; margin-top: 8px; }
        
        label { font-size: 13px; font-weight: 700; color: var(--text-sub); display: block; margin-top: 15px; }

        input[type="text"], input[type="password"], select { 
            width: 100%; padding: 12px 15px; border-radius: 10px; 
            border: 1px solid var(--input-border); background: var(--input-bg);
            color: var(--text-main); box-sizing: border-box; font-size: 14px;
            margin-top: 5px; outline: none;
        }

        input:focus { border-color: var(--btn-blue); }

        /* Icon mắt tối giản (SVG) */
        .eye-icon {
            position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
            cursor: pointer; width: 20px; height: 20px; opacity: 0.5;
            transition: 0.3s; fill: none; stroke: var(--text-main); stroke-width: 2;
        }
        .eye-icon:hover { opacity: 1; }

        .setting-group { 
            background: var(--bg-color); padding: 20px; border-radius: 15px; 
            margin: 20px 0; border: 1px solid var(--input-border); 
        }

        .btn { 
            border: none; padding: 15px; border-radius: 12px; width: 100%; 
            font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 15px;
        }
        #btnConnect { background: var(--btn-green); color: white; margin-bottom: 10px; }
        #btnSend { background: var(--btn-blue); color: white; margin-top: 10px; }
        .btn:disabled { background: #cbd5e0 !important; cursor: not-allowed; transform: none !important; }
        .btn:hover { filter: brightness(1.1); transform: translateY(-2px); }

        #log { margin-top: 20px; font-size: 13px; min-height: 40px; text-align: center; font-weight: 600; line-height: 1.4; }

        .reset-link { 
            display: block; text-align: center; margin-top: 20px; 
            font-size: 11px; color: var(--text-sub); text-decoration: none; cursor: pointer; opacity: 0.6;
        }
        .reset-link:hover { opacity: 1; color: var(--accent); }
    </style>
</head>
<body onload="loadSavedSettings()">

    <div class="card">
        <button id="theme-toggle" class="theme-toggle" onclick="toggleDarkMode()">
            <span id="theme-icon">☀️</span> <span id="theme-text">LIGHT</span>
        </button>
        
        <h2> P🍅M O D O R O</h2>
        
        <button id="btnConnect" class="btn" onclick="connectPort()">1. Connect Cable</button>

        <div class="step">
            <p><b>2. Configuration</b>></p>
        </div>
        
        <label>WiFi Name (SSID)</label>
        <input type="text" id="ssid" placeholder="Enter WiFiSSIDWiFiSSID..." oninput="saveSettings()">

        <label>WiFi Password</label>
        <div class="input-wrapper">
            <input type="password" id="pass" placeholder="Enter password..." oninput="saveSettings()">
            <!-- SVG Eye Minimalist -->
            <svg id="eye-icon" class="eye-icon" onclick="togglePass()" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
            </svg>
        </div>
        
        <div class="setting-group">
            <label style="margin-top:0">Buzzer Volume: <span id="volVal">50</span>%</label>
            <input type="range" id="vol" min="0" max="100" style="width:100%; margin-top:10px;" oninput="updateVol(this.value); saveSettings()">
            
            <div style="display: flex; align-items: center; margin-top: 20px; justify-content: space-between;">
                <span style="font-size: 14px; font-weight: 600;">24-Hour Format</span>
                <input type="checkbox" id="fmt24" checked onchange="saveSettings()">
            </div>

            <label>Screen Timeout</label>
            <select id="timeout" onchange="saveSettings()">
                <option value="10">10 Seconds</option>
                <option value="15" selected>15 Seconds</option>
                <option value="20">20 Seconds</option>
            </select>
        </div>

        <button id="btnSend" class="btn" onclick="sendData()" disabled>3. Sync Data & Settings</button>
        
        <div id="log">Device is not connected...</div>
        
        <span class="reset-link" onclick="resetAll()">Delete saved data</span>
    </div>

    <script>
        let port;

        // Ẩn hiện mật khẩu
        function togglePass() {
            const p = document.getElementById("pass");
            p.type = p.type === "password" ? "text" : "password";
        }

        function updateVol(val) { document.getElementById("volVal").innerText = val; }

        // Lưu dữ liệu
        function saveSettings() {
            const settings = {
                ssid: document.getElementById("ssid").value,
                pass: document.getElementById("pass").value,
                vol: document.getElementById("vol").value,
                fmt24: document.getElementById("fmt24").checked,
                timeout: document.getElementById("timeout").value
            };
            localStorage.setItem("pomo_settings_v3", JSON.stringify(settings));
        }

        // Tải dữ liệu
        function loadSavedSettings() {
            const isDark = localStorage.getItem("dark_mode") === "true";
            if (isDark) document.body.classList.add("dark-mode");
            updateThemeUI(isDark);

            const saved = JSON.parse(localStorage.getItem("pomo_settings_v3"));
            if (saved) {
                document.getElementById("ssid").value = saved.ssid || "";
                document.getElementById("pass").value = saved.pass || "";
                document.getElementById("vol").value = saved.vol || 50;
                document.getElementById("volVal").innerText = saved.vol || 50;
                document.getElementById("fmt24").checked = saved.fmt24;
                document.getElementById("timeout").value = saved.timeout || "15";
            }
        }

        function resetAll() {
            if(confirm("Bạn có muốn xóa toàn bộ cài đặt đã lưu không?")) {
                localStorage.clear();
                location.reload();
            }
        }

        function toggleDarkMode() {
            const isDark = document.body.classList.toggle("dark-mode");
            localStorage.setItem("dark_mode", isDark);
            updateThemeUI(isDark);
        }

        function updateThemeUI(isDark) {
            const icon = document.getElementById("theme-icon");
            icon.innerText = isDark ? "🌙" : "☀️";
            document.getElementById("theme-text").innerText = isDark ? "DARK" : "LIGHT";
            icon.style.transform = isDark ? "rotate(360deg)" : "rotate(0deg)";
        }

        // Web Serial
        async function connectPort() {
            if (!("serial" in navigator)) { alert("Trình duyệt không hỗ trợ!"); return; }
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });
                document.getElementById("btnConnect").innerText = "COM Connected [✓]";
                document.getElementById("btnConnect").style.background = "#1e7e34";
                document.getElementById("btnSend").disabled = false;
                log("Thiết bị đã sẵn sàng!", "#007bff");
            } catch (err) {
                log("Lỗi kết nối: " + err.message, "#d9534f");
            }
        }

        async function sendData() {
            if (!port) return;
            const ssid = document.getElementById("ssid").value;
            if(!ssid) { log("Vui lòng nhập SSID WiFi!", "#d9534f"); return; }

            const s = JSON.parse(localStorage.getItem("pomo_settings_v3"));
            const payload = JSON.stringify({
                s: s.ssid, p: s.pass, t: Math.floor(Date.now()/1000), 
                v: parseInt(s.vol), h: s.fmt24?1:0, o: parseInt(s.timeout)
            }) + "\r\n";

            try {
                const encoder = new TextEncoder();
                const writer = port.writable.getWriter();
                await writer.write(encoder.encode(payload));
                writer.releaseLock();
                log("Sync thành công! Thiết bị đang khởi động lại...", "#28a745");
            } catch (err) {
                log("Lỗi gửi dữ liệu: " + err.message, "#d9534f");
            }
        }

        function log(msg, color) {
            const l = document.getElementById("log");
            l.innerText = msg;
            l.style.color = color;
        }
    </script>
</body>
</html>
