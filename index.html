<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POMODORO Setup</title>
    <style>
        /* Thiết lập biến màu sắc cho Light và Dark Mode */
        :root {
            --bg-color: #eef2f7;
            --card-bg: rgba(255, 255, 255, 0.8); /* Trong suốt nhẹ */
            --text-main: #333333;
            --text-sub: #555555;
            --input-bg: rgba(255, 255, 255, 0.9);
            --input-border: #d1d9e6;
            --group-bg: rgba(248, 249, 250, 0.5);
            --accent-color: #d9534f;
        }

        .dark-mode {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --input-bg: rgba(15, 23, 42, 0.6);
            --input-border: #334155;
            --group-bg: rgba(51, 65, 85, 0.3);
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            background-color: var(--bg-color); 
            color: var(--text-main);
            padding: 40px 15px; 
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(var(--input-border) 1px, transparent 1px);
            background-size: 30px 30px;
            opacity: 0.3;
            z-index: -1;
        }
        .bg-blob {
            position: fixed;
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, #ff6b6b 0%, #f06595 100%);
            filter: blur(80px);
            border-radius: 50%;
            z-index: -1;
            opacity: 0.15;
            animation: move 20s infinite alternate;
        }

        .bg-blob.two {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            width: 300px;
            height: 300px;
            right: -100px;
            bottom: -100px;
            animation-duration: 15s;
        }
        @keyframes move {
            from { transform: translate(-10%, -10%) rotate(0deg); }
            to { transform: translate(20%, 20%) rotate(360deg); }
        }
        .card { 
            background: var(--card-bg); 
            backdrop-filter: blur(12px); /* Hiệu ứng kính mờ */
            -webkit-backdrop-filter: blur(12px);
            padding: 40px; 
            border-radius: 24px; 
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 50px rgba(0,0,0,0.1); 
            width: 100%;
            max-width: 520px; 
            text-align: left; 
            position: relative;
            z-index: 10;
        }

        /* Nút Dark Mode */
        .dark-mode-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            cursor: pointer;
            font-size: 20px;
            background: none;
            border: none;
            padding: 5px;
            width: auto;
        }

        h2 { text-align: center; margin-top: 0; color: #d9534f; margin-bottom: 25px; }

        .step { font-size: 15px; color: var(--text-sub); line-height: 1.6; margin-bottom: 15px; }
        
        input[type="text"], input[type="password"], select { 
            display: block; width: 100%; margin: 12px 0; padding: 12px; 
            border: 1px solid var(--input-border); border-radius: 8px; box-sizing: border-box;
            background: var(--input-bg);
            color: var(--text-main);
            font-size: 15px;
        }

        input[type="range"] { width: 100%; margin: 15px 0; cursor: pointer; }

        button { 
            background: #007bff; color: white; border: none; padding: 14px; 
            font-size: 16px; border-radius: 8px; cursor: pointer; width: 100%; 
            margin: 15px 0 5px 0; font-weight: bold; transition: 0.2s;
        }
        button:hover:not(:disabled) { background: #0056b3; transform: translateY(-1px); }
        button:disabled { background: #cbd5e0; cursor: not-allowed; }
        
        #btnConnect { background: #28a745; }
        #btnConnect:hover { background: #218838; }

        .setting-group { 
            background: var(--group-bg); padding: 20px; border-radius: 12px; 
            margin-top: 20px; border: 1px solid var(--input-border); 
        }

        #log { 
            margin-top: 20px; 
            font-weight: 600; 
            font-size: 13.5px; 
            min-height: 45px; 
            text-align: center; 
            display: flex; align-items: center; justify-content: center;
        }
        /* Nút chuyển đổi giao diện mới */
        .theme-toggle {
            position: absolute;
            top: 20px; right: 20px;
            background: var(--input-bg) !important;
            border: 1px solid var(--input-border) !important;
            backdrop-filter: blur(5px);
            padding: 8px 15px !important;
            border-radius: 20px !important;
            width: auto !important;
            cursor: pointer;
            display: flex; align-items: center; gap: 8px;
            font-size: 11px !important; font-weight: bold;
            color: var(--text-main) !important;
        }
        
        .theme-toggle:hover {
            border-color: #007bff !important;
            background: var(--group-bg) !important;
        }
        
        /* Hiệu ứng xoay icon khi đổi chế độ */
        #theme-icon {
            font-size: 16px;
            transition: transform 0.5s ease;
        }
        input, select, button { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body onload="loadSavedSettings()">

    <div class="bg-blob"></div>
    <div class="bg-blob two"></div>

    <div class="card">
        <button id="theme-toggle" class="theme-toggle" onclick="toggleDarkMode()">
            <span id="theme-icon">☀️</span>
            <span id="theme-text">LIGHT</span>
        </button>
        <h2>🍅 P O M O D O R O</h2>
        
        <div class="step">
            <p><b>Step 1:</b> Connect POMODORO via USB.</p>
            <p><b>Step 2:</b> Click the "Connect Cable" button.</p>
        </div>

        <button id="btnConnect" onclick="connectPort()">1. Connect Cable</button>
        
        <div class="step" style="margin-top: 25px;">
            <p><b>Step 3:</b> Flip to "CONFIG" screen & Click Sync.</p>
        </div>
        
        <b style="font-size: 15px;">WiFi Settings:</b>
        <input type="text" id="ssid" placeholder="WiFi Name (SSID)" oninput="saveSettings()">
        <input type="password" id="pass" placeholder="Password" oninput="saveSettings()">
        
        <div class="setting-group">
            <b style="font-size: 15px;">Device Settings:</b><br><br>
            
            <label>Buzzer Volume: <span id="volVal">50</span>%</label>
            <input type="range" id="vol" min="0" max="100" value="50" oninput="updateVolLabel(this.value); saveSettings()">
            
            <label style="display: flex; align-items: center; margin-top: 15px; cursor: pointer;">
                <input type="checkbox" id="fmt24" checked style="width: 18px; height: 18px; margin-right: 10px;" onchange="saveSettings()"> 
                Use 24-Hour Format
            </label>
            
            <label style="display: block; margin-top: 20px;">Screen Timeout:</label>
            <select id="timeout" onchange="saveSettings()">
                <option value="10">10 Seconds</option>
                <option value="15" selected>15 Seconds</option>
                <option value="20">20 Seconds</option>
            </select>
        </div>

        <button id="btnSend" onclick="sendData()" disabled>2. Sync Data & Settings</button>
        <div id="log">Cable not connected...</div>
    </div>

    <script>
        let port;

        // 1. Lưu cài đặt vào localStorage
        function saveSettings() {
            const settings = {
                ssid: document.getElementById("ssid").value,
                pass: document.getElementById("pass").value,
                vol: document.getElementById("vol").value,
                fmt24: document.getElementById("fmt24").checked,
                timeout: document.getElementById("timeout").value
            };
            localStorage.setItem("pomodoro_settings", JSON.stringify(settings));
        }

        // 2. Tải cài đặt từ localStorage
        function loadSavedSettings() {
            // Load theme
            if (localStorage.getItem("dark_mode") === "true") {
                document.body.classList.add("dark-mode");
            }

            // Load inputs
            const saved = localStorage.getItem("pomodoro_settings");
            if (saved) {
                const s = JSON.parse(saved);
                document.getElementById("ssid").value = s.ssid || "";
                document.getElementById("pass").value = s.pass || "";
                document.getElementById("vol").value = s.vol || 50;
                document.getElementById("volVal").innerText = s.vol || 50;
                document.getElementById("fmt24").checked = s.fmt24 !== false;
                document.getElementById("timeout").value = s.timeout || "15";
            }
        }

        // 3. Xử lý Dark Mode
        function toggleDarkMode() {
            const isDark = document.body.classList.toggle("dark-mode");
            localStorage.setItem("dark_mode", isDark);
        }

        function updateVolLabel(val) {
            document.getElementById('volVal').innerText = val;
        }

        async function connectPort() {
            if (!("serial" in navigator)) { alert("Trình duyệt không hỗ trợ Web Serial!"); return; }
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });
                document.getElementById("btnConnect").innerText = "COM Connected [✓]";
                document.getElementById("btnConnect").style.background = "#1e7e34";
                document.getElementById("btnSend").disabled = false;
                document.getElementById("log").style.color = "#007bff";
                document.getElementById("log").innerText = "Cable connected! Click Sync.";
            } catch (err) {
                document.getElementById("log").style.color = "#d9534f";
                document.getElementById("log").innerText = "Error: " + err.message;
            }
        }

        async function sendData() {
            if (!port) return;
            const settings = JSON.parse(localStorage.getItem("pomodoro_settings"));
            const payload = JSON.stringify({
                s: settings.ssid,
                p: settings.pass,
                t: Math.floor(Date.now() / 1000),
                v: parseInt(settings.vol),
                h: settings.fmt24 ? 1 : 0,
                o: parseInt(settings.timeout)
            }) + "\r\n";

            try {
                const encoder = new TextEncoder();
                const writer = port.writable.getWriter();
                await writer.write(encoder.encode(payload));
                writer.releaseLock();
                document.getElementById("log").style.color = "#28a745";
                document.getElementById("log").innerText = "Sync thành công!";
            } catch (err) {
                document.getElementById("log").style.color = "#d9534f";
                document.getElementById("log").innerText = "Gửi lỗi: " + err.message;
            }
        }
        function updateThemeUI(isDark) {
            const icon = document.getElementById("theme-icon");
            const text = document.getElementById("theme-text");
            const btn = document.getElementById("theme-toggle");
        
            if (isDark) {
                icon.innerText = "🌙";
                text.innerText = "DARK";
                icon.style.transform = "rotate(360deg)";
            } else {
                icon.innerText = "☀️";
                text.innerText = "LIGHT";
                icon.style.transform = "rotate(0deg)";
            }
        }
        
        // Sửa lại hàm toggleDarkMode
        function toggleDarkMode() {
            const isDark = document.body.classList.toggle("dark-mode");
            localStorage.setItem("dark_mode", isDark);
            updateThemeUI(isDark); // Cập nhật chữ và icon
        }
        
        // Sửa lại hàm loadSavedSettings để cập nhật đúng nút khi vừa vào trang
        function loadSavedSettings() {
            const isDark = localStorage.getItem("dark_mode") === "true";
            if (isDark) {
                document.body.classList.add("dark-mode");
            }
            updateThemeUI(isDark); // Thiết lập trạng thái nút ban đầu
        
            // ... (giữ nguyên phần load SSID, pass, vol bên dưới như cũ)
            const saved = localStorage.getItem("pomodoro_settings");
            if (saved) {
                const s = JSON.parse(saved);
                document.getElementById("ssid").value = s.ssid || "";
                document.getElementById("pass").value = s.pass || "";
                document.getElementById("vol").value = s.vol || 50;
                document.getElementById("volVal").innerText = s.vol || 50;
                document.getElementById("fmt24").checked = s.fmt24 !== false;
                document.getElementById("timeout").value = s.timeout || "15";
            }
        }
    </script>
</body>
</html>
