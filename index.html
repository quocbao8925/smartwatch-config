<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POMODORO Setup</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #f4f4f9; padding: 50px; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: inline-block; max-width: 450px; text-align: left; }
        input[type="text"], input[type="password"], select { display: block; width: 100%; margin: 10px 0; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;}
        input[type="range"] { width: 100%; margin: 10px 0; }
        button { background: #007bff; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; width: 100%; margin: 15px 0 5px 0; font-weight: bold; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #btnConnect { background: #28a745; }
        #log { margin-top: 15px; color: #333; font-weight: bold; font-size: 14px; padding: 10px; text-align: center;}
        .step { font-size: 14px; color: #555; line-height: 1.6; margin-bottom: 15px; }
        .setting-group { background: #f8f9fa; padding: 15px; border-radius: 8px; margin-top: 15px; border: 1px solid #e9ecef; }
        h2 { text-align: center; margin-top: 0; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🍅 [POMODORO] </h2>
        
        <div class="step">
            <p><b>Step 1:</b> Connect POMODORO to your computer via USB.</p>
            <p><b>Step 2:</b> Click the "Connect Cable" button below.</p>
        </div>

        <button id="btnConnect" onclick="connectPort()">1. Connect Cable</button>
        
        <div class="step" style="margin-top: 20px;">
            <p><b>Step 3:</b> Flip the device to "CONFIG" screen (Wait 5s).</p>
            <p><b>Step 4:</b> Setup your preferences below and click Sync.</p>
        </div>
        
        <b>WiFi Settings:</b>
        <input type="text" id="ssid" placeholder="WiFi Name (SSID)">
        <input type="password" id="pass" placeholder="Password">
        
        <div class="setting-group">
            <b>Device Settings:</b><br><br>
            
            <label>Buzzer Volume: <span id="volVal">50</span>%</label>
            <input type="range" id="vol" min="0" max="100" value="50" oninput="document.getElementById('volVal').innerText = this.value">
            
            <label style="display: block; margin-top: 15px; cursor: pointer;">
                <input type="checkbox" id="fmt24" checked style="transform: scale(1.2); margin-right: 5px;"> 
                Use 24-Hour Format (e.g., 14:30)
            </label>
            
            <label style="display: block; margin-top: 15px;">Screen Timeout:</label>
            <select id="timeout">
                <option value="10">10 Seconds</option>
                <option value="15" selected>15 Seconds</option>
                <option value="20">20 Seconds</option>
            </select>
        </div>

        <button id="btnSend" onclick="sendData()" disabled>2. Sync Data & Settings</button>
        <div id="log">Cable not connected...</div>
    </div>

    <script>
        let port;
        async function connectPort() {
            if (!("serial" in navigator)) { alert("Browser not supported!"); return; }
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });
                await port.setSignals({ dataTerminalReady: true, requestToSend: true });

                document.getElementById("btnConnect").innerText = "COM Connected [✓]";
                document.getElementById("btnConnect").style.background = "#218838";
                document.getElementById("btnSend").disabled = false;
                document.getElementById("log").style.color = "blue";
                document.getElementById("log").innerText = "Cable connected! Setup settings and click Sync.";
            } catch (err) {
                document.getElementById("log").style.color = "red";
                document.getElementById("log").innerText = "Connection error: " + err;
            }
        }

        async function sendData() {
            if (!port) return;

            const ssid = document.getElementById("ssid").value;
            const pass = document.getElementById("pass").value;
            const timestamp = Math.floor(Date.now() / 1000); 
            
            // Lấy dữ liệu từ các cài đặt mới
            const vol = parseInt(document.getElementById("vol").value);
            const is24h = document.getElementById("fmt24").checked ? 1 : 0;
            const tout = parseInt(document.getElementById("timeout").value);

            // Đóng gói JSON (Dùng ký tự v, h, o cho ngắn gọn để tiết kiệm buffer ESP32)
            const payload = JSON.stringify({ s: ssid, p: pass, t: timestamp, v: vol, h: is24h, o: tout }) + "\r\n";

            try {
                const encoder = new TextEncoder();
                const writer = port.writable.getWriter();
                await writer.write(encoder.encode(payload));
                writer.releaseLock();
                document.getElementById("log").style.color = "green";
                document.getElementById("log").innerText = "Sync successful! Device will restart.";
            } catch (err) {
                document.getElementById("log").style.color = "red";
                document.getElementById("log").innerText = "Sending error: " + err;
            }
        }
    </script>
</body>
</html>
